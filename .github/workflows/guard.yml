# The trusted half of the review (tools/guard.py): what a pull request may change and who set "reviewed".
# pull_request_target runs this file, the tools and MAINTAINERS from the base branch, so a pull request
# cannot change the rules it is checked by. The pull request is fetched as data and never executed:
# no step here runs, installs or imports anything from it. Plugin code runs only in check.yml.
name: guard

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request (data only)
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${NUMBER}/head:refs/remotes/pull/head"
      - name: What it changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: python3 tools/guard.py --base "$BASE" --head refs/remotes/pull/head --actor "$ACTOR"
